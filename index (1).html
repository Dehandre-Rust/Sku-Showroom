<style>
  html, body { font-family:'Inter',system-ui,sans-serif; background:#FFF8F1; color:#1E2A4A; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#F6E3C7; border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:#FFA384; }

  .gradient-warm { background-image:linear-gradient(135deg,#FF6B4A 0%,#FF855C 35%,#FFA384 65%,#FFC2AD 100%); }
  .gradient-hero {
    background-image: radial-gradient(at 20% 10%, rgba(255,107,74,0.25) 0px, transparent 50%),
                      radial-gradient(at 80% 0%, rgba(255,163,132,0.35) 0px, transparent 50%),
                      radial-gradient(at 0% 100%, rgba(30,42,74,0.08) 0px, transparent 50%),
                      linear-gradient(135deg,#FF6B4A,#FF855C 50%,#FF855C 65%,#1E2A4A);
  }
  .gradient-mint { background-image:linear-gradient(135deg,#10B981,#34D399 60%,#A7F3D0); }
  .gradient-navy { background-image:linear-gradient(135deg,#1E2A4A,#445C86); }
  .gradient-cream { background-image:linear-gradient(135deg,#FFF8F1,#FCEFDE 60%,#F6E3C7); }
  .gradient-text {
    background-image:linear-gradient(135deg,#FF6B4A 0%,#E5532F 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .glass { background:rgba(255,255,255,0.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.5); }

  .card-hover { transition:transform .25s ease, box-shadow .25s ease; }
  .card-hover:hover { transform:translateY(-4px); box-shadow:0 24px 42px -18px rgba(30,42,74,0.25); }

  .skeleton {
    background:linear-gradient(90deg,#FCEFDE 0%,#FFF8F1 50%,#FCEFDE 100%);
    background-size:200% 100%; animation:shimmer 1.4s ease-in-out infinite; border-radius:12px;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  .page-fade { animation:fadeUp .35s ease; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .nav-pill { position:relative; }
  .nav-pill[data-active="true"] {
    background-image:linear-gradient(135deg,#FF6B4A,#FF855C); color:#fff;
    box-shadow:0 10px 24px -10px rgba(255,107,74,0.6);
  }
  .nav-pill:not([data-active="true"]):hover { background:#FFE0D6; color:#E5532F; }

  .badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:4px 8px; border-radius:999px; }
  .badge-in  { background:#D1FAE5; color:#047857; }
  .badge-low { background:#FEF3C7; color:#B45309; }
  .badge-out { background:#FEE2E2; color:#B91C1C; }
  .badge-new { background:#FFE0D6; color:#B33D20; }
  .badge-best{ background:#FFEDD5; color:#9A3412; }

  .drag-over { outline:2px dashed #FF6B4A; outline-offset:-6px; background:#FFF1ED; }
  .dragging  { opacity:.4; }

  .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:12px; font-weight:600; font-size:14px; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; cursor:pointer; }
  .btn-primary { background-image:linear-gradient(135deg,#FF6B4A,#E5532F); color:#fff; box-shadow:0 10px 22px -10px rgba(255,107,74,0.6); }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 16px 28px -10px rgba(255,107,74,0.7); }
  .btn-ghost { background:transparent; color:#1E2A4A; border:1px solid #F6E3C7; }
  .btn-ghost:hover { background:#FFF1ED; border-color:#FFC2AD; color:#E5532F; }
  .btn-dark { background:#1E2A4A; color:#fff; }
  .btn-dark:hover { background:#141C30; }

  .input { width:100%; padding:10px 14px 10px 40px; border-radius:12px; border:1px solid #F6E3C7; background:#fff; font-size:14px; }
  .input:focus { outline:none; border-color:#FF6B4A; box-shadow:0 0 0 4px rgba(255,107,74,0.15); }
  .input-plain { width:100%; padding:10px 14px; border-radius:12px; border:1px solid #F6E3C7; background:#fff; font-size:14px; }
  .input-plain:focus { outline:none; border-color:#FF6B4A; box-shadow:0 0 0 4px rgba(255,107,74,0.15); }

  input[type=range] { accent-color:#FF6B4A; }

  @media (max-width: 1023px) {
    #sidebar { transform:translateX(-110%); transition:transform .25s ease; }
    #sidebar.open { transform:translateX(0); }
  }

  .product-img-wrap {
    position:relative; display:flex; align-items:center; justify-content:center;
    overflow:hidden; border-radius:16px;
    background:linear-gradient(135deg,#FFF8F1 0%,#FCEFDE 100%);
  }
  .product-img-wrap::after {
    content:''; position:absolute; inset:0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.55), transparent 60%);
    pointer-events:none;
  }
  .product-img-wrap img {
    max-height:80%; max-width:80%; object-fit:contain;
    filter: drop-shadow(0 8px 14px rgba(30,42,74,0.18));
    transition: transform .35s ease;
  }
  .card-hover:hover .product-img-wrap img { transform: scale(1.05); }
  .product-img-fallback {
    display:flex; align-items:center; justify-content:center;
    width:64px; height:64px; border-radius:50%;
    background-image:linear-gradient(135deg,#FF6B4A,#FF855C);
    color:#fff; font-weight:800;
  }

  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:100; }
  .toast-item {
    background:#1E2A4A; color:#fff; padding:12px 18px; border-radius:12px;
    box-shadow:0 18px 38px -14px rgba(30,42,74,0.45); margin-top:8px;
    display:flex; align-items:center; gap:10px; font-weight:500; font-size:14px;
    animation:fadeUp .25s ease;
  }
</style>

<script>
// ============================================================================
// LOAD CATALOG
// ============================================================================
const CATALOG = JSON.parse(document.getElementById('catalogData').textContent);
const SKUS = CATALOG.products;
const BRANDS = CATALOG.brands;
const PLATFORMS = CATALOG.platforms;

const CATEGORY_META = {
  'Spray Paint':  { icon:'spray-can', emoji:'🎨', gradient:'linear-gradient(135deg,#FF6B4A,#FF855C)' },
  'Specialty':    { icon:'sparkles',  emoji:'✨', gradient:'linear-gradient(135deg,#A855F7,#FF6B4A)' },
  'Industrial':   { icon:'hard-hat',  emoji:'🪖', gradient:'linear-gradient(135deg,#1E2A4A,#445C86)' },
  'Automotive':   { icon:'car',       emoji:'🚗', gradient:'linear-gradient(135deg,#0EA5E9,#1E2A4A)' },
  'Cleaners':     { icon:'droplets',  emoji:'🧴', gradient:'linear-gradient(135deg,#10B981,#34D399)' },
  'Wood & Stain': { icon:'tree-pine', emoji:'🪵', gradient:'linear-gradient(135deg,#92400E,#F59E0B)' },
};
const CATEGORIES = CATALOG.categories.map(c => ({ id:c, name:c, ...CATEGORY_META[c] }));

const TAGS = ['new','bestseller','premium','restock','featured'];

// ============================================================================
// STORE
// ============================================================================
const STORAGE_KEY = 'sku-showroom-rustoleum-v1';
const defaultSettings = {
  user: { name:'Dehandre Wepener', email:'Dehandre.Wepener@rustoleum.co.za', role:'Key Accounts Manager' },
  preferences: { currency:'ZAR', defaultView:'grid', density:'comfortable', notifications:true, autoSaveShowcases:true },
};

function defaultShowcases(){
  const pick = (cat, n) => SKUS.filter(s=>s.category===cat).slice(0,n).map(s=>s.id);
  return [
    { id:'sc-1', name:'Massbuild Q2 Pitch — Spray Paint Range', client:'Massbuild',         createdAt: Date.now()-86400000*3,  productIds: pick('Spray Paint', 8) },
    { id:'sc-2', name:'Industrial & Stops Rust Selection',     client:'Builders Warehouse', createdAt: Date.now()-86400000*7,  productIds: pick('Industrial', 6) },
    { id:'sc-3', name:'Automotive Refinishing Range',          client:'Midas Group',        createdAt: Date.now()-86400000*14, productIds: pick('Automotive', 8) },
  ];
}

function loadStore(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { showcases: defaultShowcases(), settings: defaultSettings };
    const parsed = JSON.parse(raw);
    return {
      showcases: parsed.showcases || defaultShowcases(),
      settings:  Object.assign({}, defaultSettings, parsed.settings || {}),
    };
  } catch { return { showcases: defaultShowcases(), settings: defaultSettings }; }
}
function saveStore(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }

const store = loadStore();

const state = {
  route: 'dashboard',
  params: {},
  catalog: {
    search: '',
    categories: new Set(),
    brands: new Set(),
    stock: new Set(),
    tags: new Set(),
    priceMax: 800,
    sort: 'newest',
    view: store.settings.preferences.defaultView,
    page: 1,
    perPage: 12,
  },
  loading: false,
};

// ============================================================================
// UTILS
// ============================================================================
function fmtPrice(n){
  const cur = store.settings.preferences.currency || 'ZAR';
  const symbol = { ZAR:'R', USD:'$', EUR:'€', GBP:'£' }[cur] || 'R';
  if(!n || n === 0) return symbol + ' —';
  return symbol + ' ' + n.toFixed(2);
}
function stockStatus(s){
  if(s.stock===0) return {label:'Out of stock', cls:'badge-out', pct:0};
  if(s.stock<15)  return {label:'Low stock',     cls:'badge-low', pct: Math.max(8, (s.stock/150)*100)};
  return {label:'In stock', cls:'badge-in', pct: Math.min(100, (s.stock/150)*100)};
}
function isNewArrival(s){ return s.daysAgo<=14 || (s.tags && s.tags.includes('new')); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' }); }

function toast(message, icon='check-circle'){
  const wrap = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.innerHTML = `<i data-lucide="${icon}" style="width:18px;height:18px"></i><span>${message}</span>`;
  wrap.appendChild(el);
  lucide.createIcons();
  setTimeout(()=>{ el.style.transition='opacity .25s ease, transform .25s ease'; el.style.opacity='0'; el.style.transform='translateY(8px)'; }, 2200);
  setTimeout(()=> el.remove(), 2600);
}

function productImage(p, opts={}){
  const h = opts.height || 'h-44';
  const initial = (p.name || '?').charAt(0).toUpperCase();
  const meta = CATEGORY_META[p.category] || {};
  const badgeNew = isNewArrival(p)
    ? `<div class="absolute top-3 left-3 badge badge-new">NEW</div>` : '';
  const badgeBest = p.tags && p.tags.includes('bestseller')
    ? `<div class="absolute top-3 right-3 badge badge-best"><i data-lucide="flame" style="width:12px;height:12px"></i>BEST</div>` : '';
  const fallback = `<div class="product-img-fallback" style="background-image:${meta.gradient||'linear-gradient(135deg,#FF6B4A,#FF855C)'};${opts.big?'width:120px;height:120px;font-size:48px;':''}">${initial}</div>`;
  const img = p.image
    ? `<img src="${p.image}" alt="${(p.name||'').replace(/"/g,'&quot;')}" loading="lazy" onerror="this.outerHTML='${fallback.replace(/'/g,"\\'")}'">`
    : fallback;
  return `<div class="product-img-wrap ${h}">${img}${badgeNew}${badgeBest}</div>`;
}

// ============================================================================
// ROUTER
// ============================================================================
function parseHash(){
  const raw = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const [path, query] = raw.split('?');
  const parts = path.split('/');
  return { route: parts[0] || 'dashboard', params: { id: parts.slice(1).join('/') }, query: query||'' };
}

function navigate(){
  const p = parseHash();
  state.route = p.route;
  state.params = p.params;
  state.query = p.query;
  document.querySelectorAll('[data-route]').forEach(a => {
    a.setAttribute('data-active', a.dataset.route === state.route ? 'true' : 'false');
  });
  closeSidebarMobile();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('hashchange', navigate);

// ============================================================================
// RENDER
// ============================================================================
function render(){
  const view = document.getElementById('view');
  view.classList.remove('page-fade'); void view.offsetWidth; view.classList.add('page-fade');
  switch(state.route){
    case 'dashboard': renderDashboard(view); break;
    case 'catalog':   renderCatalog(view); break;
    case 'product':   renderProduct(view); break;
    case 'showcases': renderShowcases(view); break;
    case 'showcase':  renderShowcaseDetail(view); break;
    case 'analytics': renderAnalytics(view); break;
    case 'settings':  renderSettings(view); break;
    default:          renderDashboard(view);
  }
  lucide.createIcons();
}

// ----------- DASHBOARD -----------

  const newArrivals = SKUS.filter(isNewArrival).length;

  view.innerHTML = `

      <div class="absolute -top-16 -right-16 w-64 h-64 rounded-full bg-white/10 blur-2xl"></div>
      <div class="absolute -bottom-20 -left-10 w-80 h-80 rounded-full bg-coral-200/20 blur-3xl"></div>
      <div class="relative max-w-3xl">
        <div class="inline-flex items-center gap-2 bg-white/15 border border-white/25 px-3 py-1.5 rounded-full text-xs font-semibold mb-5">
          <i data-lucide="sparkles" style="width:14px;height:14px"></i> Welcome back, Dehandre
        </div>
        <h1 class="text-3xl sm:text-5xl lg:text-6xl font-extrabold leading-tight">Your Rust-Oleum<br/>SKU showroom.</h1>
        <p class="mt-4 text-base sm:text-lg text-white/85 max-w-xl">Browse the full range — Spray Paint, Industrial, Automotive, Specialty, Cleaners, Wood &amp; Stain — and build client-ready showcases in a few clicks.</p>
        <form id="heroSearch" class="mt-6 flex items-center gap-2 max-w-xl">
          <div class="relative flex-1">
            <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-navy-400" style="width:18px;height:18px"></i>
            <input id="heroSearchInput" placeholder="Search SKUs, colours, brands, platforms…" class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-white text-navy-500 placeholder-navy-300 shadow-soft focus:outline-none focus:ring-4 focus:ring-coral-300/40" />
          </div>
          <button type="submit" class="btn btn-dark py-3.5">Search</button>
        </form>
        <div class="mt-6 flex flex-wrap gap-2 text-xs">
          ${['Bestsellers','New arrivals','Stops Rust','Painters Touch','Spraymate','Krud Kutter'].map(t=>`
            <a href="#/catalog" class="bg-white/15 border border-white/25 hover:bg-white/25 transition px-3 py-1.5 rounded-full">${t}</a>
          `).join('')}
        </div>
      </div>
    </section>

    <section class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mt-8">
      ${statCard('Total SKUs',   total,       'package',       'gradient-warm')}
      ${statCard('Categories',   cats,        'layers',        'gradient-navy')}
      ${statCard('In Stock',     inStock,     'check-circle',  'gradient-mint')}
      ${statCard('Out of Stock', outStock,    'alert-circle',  'gradient-cream', true)}
      ${statCard('New Arrivals', newArrivals, 'rocket',        'gradient-warm')}
    </section>

    <section class="mt-10">
      <div class="flex items-end justify-between mb-5">
        <div>
          <div class="text-xs font-semibold text-coral-600 uppercase tracking-wider">Curated for you</div>
          <h2 class="text-2xl sm:text-3xl font-extrabold text-navy-500">Featured products</h2>
        </div>
        <div class="flex items-center gap-2">
          <button id="carouselPrev" class="btn btn-ghost py-2 px-3" aria-label="Previous"><i data-lucide="chevron-left" style="width:18px;height:18px"></i></button>
          <button id="carouselNext" class="btn btn-ghost py-2 px-3" aria-label="Next"><i data-lucide="chevron-right" style="width:18px;height:18px"></i></button>
          <a href="#/catalog" class="btn btn-primary py-2 hidden sm:inline-flex">View all <i data-lucide="arrow-right" style="width:16px;height:16px"></i></a>
        </div>
      </div>
      <div class="overflow-hidden">
        <div id="carouselTrack" class="flex gap-5 transition-transform duration-500" style="transform:translateX(0)">
          ${featured.map(p=>`
            <a href="#/product/${p.id}" class="card-hover shrink-0 w-[280px] sm:w-[320px] bg-white rounded-3xl shadow-soft overflow-hidden block">
              <div class="relative">${productImage(p,{height:'h-56'})}</div>
              <div class="p-5">
                <div class="text-[11px] font-semibold text-navy-300 tracking-wider uppercase">${p.brand} · ${p.platform}</div>
                <div class="font-bold text-navy-500 mt-1 line-clamp-2">${p.name}</div>
                <div class="text-xs text-navy-300 font-mono mt-1">SKU ${p.sku}</div>
                <div class="mt-3 flex items-center justify-between">
                  <div class="text-lg font-extrabold gradient-text">${fmtPrice(p.price)}</div>
                  <span class="badge ${stockStatus(p).cls}">${stockStatus(p).label}</span>
                </div>
              </div>
            </a>
          `).join('')}
        </div>
      </div>
    </section>

    <section class="mt-12">
      <div class="flex items-end justify-between mb-5">
        <div>
          <div class="text-xs font-semibold text-coral-600 uppercase tracking-wider">Browse by</div>
          <h2 class="text-2xl sm:text-3xl font-extrabold text-navy-500">Categories</h2>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
        ${CATEGORIES.map(c=>`

            <div class="absolute -bottom-6 -right-4 text-7xl opacity-30">${c.emoji}</div>
            <div class="relative">
              <div class="w-10 h-10 rounded-2xl bg-white/20 flex items-center justify-center mb-4">

        `).join('')}

    <section class="mt-12 grid lg:grid-cols-3 gap-5">

          <a href="#/analytics" class="text-xs font-semibold text-coral-600 hover:text-coral-700">View analytics →</a>

  `;

  document.getElementById('heroSearch').addEventListener('submit', e=>{

    location.hash = '#/catalog';
  });

  let cIndex = 0;
  const track = document.getElementById('carouselTrack');
  const move = (dir)=>{
    const cards = track.children; if(!cards.length) return;
    const cardW = cards[0].getBoundingClientRect().width + 20;
    const maxIndex = Math.max(0, cards.length - Math.floor(track.parentElement.clientWidth / cardW));
    cIndex = Math.min(maxIndex, Math.max(0, cIndex + dir));
    track.style.transform = `translateX(${-cIndex * cardW}px)`;
  };
  document.getElementById('carouselPrev').addEventListener('click', ()=>move(-1));
  document.getElementById('carouselNext').addEventListener('click', ()=>move(1));

  drawStockHealthChart('#miniBar');

function statCard(label, value, icon, gradient, dark){
  return `
    <div class="rounded-3xl p-5 shadow-soft ${gradient} ${dark?'text-navy-500':'text-white'} card-hover relative overflow-hidden">
      <div class="absolute -bottom-4 -right-4 opacity-25"><i data-lucide="${icon}" style="width:80px;height:80px"></i></div>
      <div class="text-xs font-semibold uppercase tracking-wider opacity-80">${label}</div>
      <div class="text-3xl font-extrabold mt-2">${value}</div>
    </div>
  `;
}

function drawStockHealthChart(selector){
  const el = document.querySelector(selector); el.innerHTML='';
  const data = CATEGORIES.map(c=>{
    const items = SKUS.filter(s=>s.category===c.id);
    return { cat:c.name,
      inStock: items.filter(s=>s.stock>=15).length,
      low:     items.filter(s=>s.stock>0 && s.stock<15).length,
      out:     items.filter(s=>s.stock===0).length };
  });
  const w = el.clientWidth, h = 240;
  const m = { top:10, right:10, bottom:40, left:30 };
  const svg = d3.select(el).append('svg').attr('width', w).attr('height', h);
  const x = d3.scaleBand().domain(data.map(d=>d.cat)).range([m.left, w-m.right]).padding(0.3);
  const yMax = d3.max(data, d=>d.inStock+d.low+d.out) || 1;
  const y = d3.scaleLinear().domain([0, yMax]).range([h-m.bottom, m.top]);
  const stack = d3.stack().keys(['inStock','low','out'])(data);
  const colors = { inStock:'#10B981', low:'#F59E0B', out:'#EF4444' };
  svg.append('g').selectAll('g').data(stack).join('g').attr('fill', d=>colors[d.key])
    .selectAll('rect').data(d=>d).join('rect')
    .attr('x', d=>x(d.data.cat))
    .attr('y', d=>y(d[1]))
    .attr('height', d=>y(d[0])-y(d[1]))
    .attr('width', x.bandwidth())
    .attr('rx', 6);
  svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x))
    .selectAll('text').style('font-size','11px').style('fill','#445C86').attr('transform','rotate(-15)').style('text-anchor','end');
  svg.selectAll('.domain, .tick line').remove();
}

function filterAndSort(){
  const c = state.catalog;
  let list = SKUS.filter(s=>{
    if(c.search){
      const q = c.search.toLowerCase();
      if(!(
        s.name.toLowerCase().includes(q) ||
        s.sku.toLowerCase().includes(q) ||
        (s.brand||'').toLowerCase().includes(q) ||
        (s.platform||'').toLowerCase().includes(q) ||
        (s.colour||'').toLowerCase().includes(q) ||
        (s.size||'').toLowerCase().includes(q) ||
        (s.description||'').toLowerCase().includes(q)
      )) return false;
    }
    if(c.categories.size && !c.categories.has(s.category)) return false;
    if(c.brands.size && !c.brands.has(s.brand)) return false;
    if(c.tags.size && !s.tags.some(t=>c.tags.has(t))) return false;
    if(c.stock.size){
      const map = { 'In stock':'in','Low stock':'low','Out of stock':'out' };
      if(!c.stock.has(map[stockStatus(s).label])) return false;
    }
    if(s.price > c.priceMax) return false;
    return true;
  });
  switch(c.sort){
    case 'name':       list.sort((a,b)=>a.name.localeCompare(b.name)); break;
    case 'priceAsc':   list.sort((a,b)=>a.price-b.price); break;
    case 'priceDesc':  list.sort((a,b)=>b.price-a.price); break;
    case 'popularity': list.sort((a,b)=>b.sales-a.sales); break;
    default:           list.sort((a,b)=>a.daysAgo-b.daysAgo);
  }
  return list;
}

function renderCatalogResults(){
  const list = filterAndSort();
  const c = state.catalog;
  const totalPages = Math.max(1, Math.ceil(list.length / c.perPage));
  c.page = Math.min(c.page, totalPages);
  const start = (c.page-1) * c.perPage;
  const slice = list.slice(start, start + c.perPage);

  document.getElementById('resultsMeta').innerHTML = `
    <span><b class="text-navy-500">${list.length}</b> products</span>
    <span class="text-xs">Page ${c.page} of ${totalPages}</span>`;

  const results = document.getElementById('results');
  if(!list.length){
    results.innerHTML = `
      <div class="bg-white rounded-3xl shadow-soft p-12 text-center">
        <div class="w-20 h-20 rounded-full gradient-cream mx-auto flex items-center justify-center mb-4 text-3xl">🪺</div>
        <div class="text-xl font-extrabold text-navy-500">No products match your filters</div>
        <p class="text-sm text-navy-300 mt-2">Try removing a filter or broadening your search.</p>
        <button onclick="document.getElementById('clearFilters').click()" class="btn btn-primary mt-5 mx-auto">Clear filters</button>
      </div>`;
    document.getElementById('pagination').innerHTML=''; return;
  }

  if(c.view==='grid'){
    results.innerHTML = `<div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-5">${slice.map(productCard).join('')}</div>`;
  } else {
    results.innerHTML = `<div class="space-y-3">${slice.map(productRow).join('')}</div>`;
  }

  const pag = document.getElementById('pagination'); pag.innerHTML='';
  if(totalPages > 1){
    const mk = (label, page, disabled=false, active=false) => {
      const b = document.createElement('button');
      b.className = `btn ${active?'btn-primary':'btn-ghost'} ${disabled?'opacity-40 cursor-not-allowed':''}`;
      b.innerHTML = label;
      if(!disabled && !active) b.addEventListener('click', ()=>{ c.page = page; renderCatalogResults(); window.scrollTo({ top:200, behavior:'smooth'}); });
      pag.appendChild(b);
    };
    mk('<i data-lucide="chevron-left" style="width:16px;height:16px"></i>', c.page-1, c.page===1);
    for(let i=1; i<=totalPages; i++){
      if(i===1 || i===totalPages || Math.abs(i-c.page)<=1) mk(String(i), i, false, i===c.page);
      else if(i===c.page-2 || i===c.page+2){
        const dots = document.createElement('span'); dots.textContent='…'; dots.className='px-2 text-navy-300'; pag.appendChild(dots);
      }
    }
    mk('<i data-lucide="chevron-right" style="width:16px;height:16px"></i>', c.page+1, c.page===totalPages);
  }
  lucide.createIcons();
}

    </div>`;
  document.body.appendChild(wrap);
  lucide.createIcons();
  const close = ()=> wrap.remove();
  wrap.querySelector('.closeX').addEventListener('click', close);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) close(); });
  wrap.querySelectorAll('.pick').forEach(b=>{
    b.addEventListener('click', ()=>{
      const sc = store.showcases.find(x=>x.id===b.dataset.sc);
      if(!sc.productIds.includes(productId)) sc.productIds.push(productId);
      saveStore(); toast(`Added to "${sc.name}"`, 'check-circle'); close();

    store.showcases.unshift(sc); saveStore();
    toast(`Showcase "${name}" created`, 'check-circle'); close();

function wireShowcaseDetail(sc, view){
  document.getElementById('saveSc').addEventListener('click', ()=>{
    sc.name = document.getElementById('scName').value.trim() || sc.name;
    sc.client = document.getElementById('scClient').value.trim() || sc.client;
    saveStore(); toast('Showcase saved','save');
  });
  document.getElementById('dupeSc').addEventListener('click', ()=>{
    const copy = { ...sc, id:'sc-'+Date.now(), name: sc.name+' (copy)', createdAt: Date.now(), productIds:[...sc.productIds] };
    store.showcases.unshift(copy); saveStore(); location.hash = '#/showcase/' + copy.id;
  });
  document.getElementById('shareSc').addEventListener('click', ()=>{
    const link = `${location.origin}${location.pathname}#/showcase/${sc.id}`;
    navigator.clipboard?.writeText(link).catch(()=>{});
    toast('Share link copied', 'link');
  });
  document.getElementById('exportSc').addEventListener('click', ()=> exportShowcase(sc));

  const addSearch = document.getElementById('addSearch');
  const addList = document.getElementById('addList');
  function renderAddList(){
    const q = addSearch.value.toLowerCase().trim();
    const available = SKUS.filter(p =>
      !sc.productIds.includes(p.id) &&
      (!q || p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q) || (p.colour||'').toLowerCase().includes(q))
    ).slice(0, 40);
    addList.innerHTML = available.length ? available.map(p=>`
      <button data-add="${p.id}" class="addBtn w-full flex items-center gap-3 p-2 rounded-xl hover:bg-cream-100 text-left">
        <div class="w-10 h-10 shrink-0">${productImage(p,{height:'h-10'})}</div>
        <div class="flex-1 min-w-0">
          <div class="font-semibold text-navy-500 text-sm truncate">${p.name}</div>
          <div class="text-xs text-navy-300 font-mono">SKU ${p.sku}</div>
        </div>
        <i data-lucide="plus" style="width:16px;height:16px" class="text-coral-500"></i>
      </button>`).join('') : `<div class="text-sm text-navy-300 p-3">All matching SKUs are already in this showcase.</div>`;
    lucide.createIcons();
    addList.querySelectorAll('.addBtn').forEach(b=>{
      b.addEventListener('click', ()=>{ sc.productIds.push(b.dataset.add); saveStore(); refresh(); });
    });
  }
  addSearch.addEventListener('input', renderAddList);
  renderAddList();

  function refresh(){
    document.getElementById('scItems').innerHTML = renderShowcaseItems(sc);
    document.getElementById('scCount').textContent = sc.productIds.length;
    lucide.createIcons(); wireDragAndRemove(); renderAddList();
  }
  function wireDragAndRemove(){
    const container = document.getElementById('scItems');
    let dragId = null;
    container.querySelectorAll('.sc-item').forEach(item=>{
      item.addEventListener('dragstart', ()=>{ dragId = item.dataset.id; item.classList.add('dragging'); });
      item.addEventListener('dragend', ()=> item.classList.remove('dragging'));
      item.addEventListener('dragover', e=>{ e.preventDefault(); item.classList.add('drag-over'); });
      item.addEventListener('dragleave', ()=> item.classList.remove('drag-over'));
      item.addEventListener('drop', e=>{
        e.preventDefault(); item.classList.remove('drag-over');
        const targetId = item.dataset.id;
        if(dragId===null || dragId===targetId) return;
        const from = sc.productIds.indexOf(dragId);
        const to   = sc.productIds.indexOf(targetId);
        sc.productIds.splice(from,1); sc.productIds.splice(to,0,dragId);
        saveStore(); refresh(); toast('Reordered','arrow-down-up');
      });
    });
    container.querySelectorAll('.rm').forEach(b=>{
      b.addEventListener('click', ()=>{
        const id = b.closest('.sc-item').dataset.id;
        sc.productIds = sc.productIds.filter(x=>x!==id);
        saveStore(); refresh(); toast('Removed','trash-2');
      });
    });
  }
  wireDragAndRemove();
}

function exportShowcase(sc){
  const lines = [
    `Showcase: ${sc.name}`,
    `Client: ${sc.client}`,
    `Created: ${fmtDate(sc.createdAt)}`,
    `Prepared by: ${store.settings.user.name}`,
    '',
    'SKU,NAME,BRAND,PLATFORM,COLOUR,SIZE,PRICE_EX_VAT,STOCK,BARCODE,TDS_URL',
  ];
  sc.productIds.forEach(id=>{
    const p = SKUS.find(s=>s.id===id); if(!p) return;
    lines.push([p.sku,p.name,p.brand,p.platform,p.colour,p.size,p.price,p.stock,p.barcode,p.tdsUrl]
      .map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([lines.join('\n')], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = sc.name.replace(/[^\w]+/g,'_') + '.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('Exported as CSV', 'download');
}

function drawTopBar(sel, days){
  const el = document.querySelector(sel); el.innerHTML='';
  const top = [...SKUS].sort((a,b)=>b.views-a.views).slice(0,10);
  const w = el.clientWidth, h = 360;
  const m = { top:10, right:16, bottom:30, left:200 };
  const svg = d3.select(el).append('svg').attr('width', w).attr('height', h);
  const y = d3.scaleBand().domain(top.map(d=>d.name.length>32?d.name.slice(0,30)+'…':d.name)).range([m.top, h-m.bottom]).padding(0.25);
  const x = d3.scaleLinear().domain([0, d3.max(top, d=>d.views*(days/30))]).range([m.left, w-m.right]);
  const grad = svg.append('defs').append('linearGradient').attr('id','barGrad').attr('x1','0').attr('x2','1');
  grad.append('stop').attr('offset','0%').attr('stop-color','#FF6B4A');
  grad.append('stop').attr('offset','100%').attr('stop-color','#FF855C');
  svg.append('g').selectAll('rect').data(top).join('rect')
    .attr('y', d=>y(d.name.length>32?d.name.slice(0,30)+'…':d.name))
    .attr('height', y.bandwidth()).attr('x', m.left).attr('width', 0)
    .attr('rx', 8).attr('fill','url(#barGrad)')
    .transition().duration(700).attr('width', d => x(d.views*(days/30)) - m.left);
  svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).tickSize(0))
    .selectAll('text').style('font-size','11px').style('fill','#1E2A4A').style('font-weight','500');
  svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x).ticks(5))
    .selectAll('text').style('font-size','11px').style('fill','#445C86');
  svg.selectAll('.domain, .tick line').attr('stroke','#FCEFDE');
}

function drawDonut(sel, legendSel){
  const el = document.querySelector(sel); el.innerHTML='';
  const data = CATEGORIES.map(c=>({ name:c.name, value: SKUS.filter(s=>s.category===c.id).length }));
  const w = el.clientWidth, h = 340;
  const r = Math.min(w, h)/2 - 16;
  const svg = d3.select(el).append('svg').attr('width',w).attr('height',h).append('g').attr('transform',`translate(${w/2},${h/2})`);
  const palette = ['#FF6B4A','#A855F7','#1E2A4A','#0EA5E9','#10B981','#F59E0B'];
  const pie = d3.pie().value(d=>d.value).sort(null);
  const arc = d3.arc().innerRadius(r-60).outerRadius(r).cornerRadius(6).padAngle(0.02);
  svg.selectAll('path').data(pie(data)).join('path').attr('fill',(d,i)=>palette[i%palette.length]).attr('d',arc);
  const total = d3.sum(data, d=>d.value);
  svg.append('text').attr('text-anchor','middle').attr('dy','-4').attr('font-size','12').attr('fill','#445C86').text('Total SKUs');
  svg.append('text').attr('text-anchor','middle').attr('dy','20').attr('font-size','28').attr('font-weight','800').attr('fill','#1E2A4A').text(total);
  const legend = document.querySelector(legendSel);
  legend.innerHTML = data.map((d,i)=>`
    <div class="flex items-center gap-2">
      <span style="background:${palette[i%palette.length]}" class="w-3 h-3 rounded-sm"></span>
      <span class="text-navy-500 font-semibold">${d.name}</span>
      <span class="ml-auto text-navy-300">${d.value}</span>
    </div>`).join('');
}

function drawTrend(sel, days){
  const el = document.querySelector(sel); el.innerHTML='';
  const w = el.clientWidth, h = 300;
  const m = { top:16, right:16, bottom:30, left:50 };
  const today = new Date();
  const baseStock = d3.sum(SKUS, s=>s.stock);
  const data = d3.range(days).map(i=>{
    const date = new Date(today); date.setDate(today.getDate()-(days-1-i));
    const seasonal = Math.sin(i/6)*120 + (Math.cos(i/9)*80);
    const drift = i * (days>90 ? -0.8 : 1.5);
    return { date, value: Math.round(baseStock + seasonal + drift) };
  });
  const svg = d3.select(el).append('svg').attr('width',w).attr('height',h);
  const x = d3.scaleTime().domain(d3.extent(data,d=>d.date)).range([m.left, w-m.right]);
  const y = d3.scaleLinear().domain([d3.min(data,d=>d.value)*0.95, d3.max(data,d=>d.value)*1.05]).range([h-m.bottom, m.top]);
  const grad = svg.append('defs').append('linearGradient').attr('id','areaGrad').attr('x1','0').attr('x2','0').attr('y1','0').attr('y2','1');
  grad.append('stop').attr('offset','0%').attr('stop-color','#FF6B4A').attr('stop-opacity',0.35);
  grad.append('stop').attr('offset','100%').attr('stop-color','#FF6B4A').attr('stop-opacity',0);
  const area = d3.area().curve(d3.curveCatmullRom).x(d=>x(d.date)).y0(h-m.bottom).y1(d=>y(d.value));
  const line = d3.line().curve(d3.curveCatmullRom).x(d=>x(d.date)).y(d=>y(d.value));
  svg.append('path').datum(data).attr('fill','url(#areaGrad)').attr('d', area);
  svg.append('path').datum(data).attr('fill','none').attr('stroke','#FF6B4A').attr('stroke-width',3).attr('d', line);
  svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x).ticks(Math.min(7, Math.floor(w/100))).tickFormat(d3.timeFormat('%d %b')))
    .selectAll('text').style('font-size','11px').style('fill','#445C86');
  svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(5))
    .selectAll('text').style('font-size','11px').style('fill','#445C86');
  svg.selectAll('.domain, .tick line').attr('stroke','#FCEFDE');
}

function drawSalesBar(sel, days){
  const el = document.querySelector(sel); el.innerHTML='';
  const data = CATEGORIES.map(c=>({ name:c.name, sales: d3.sum(SKUS.filter(s=>s.category===c.id), s=>s.sales)*(days/30) }));
  const w = el.clientWidth, h = 300;
  const m = { top:16, right:16, bottom:60, left:50 };
  const svg = d3.select(el).append('svg').attr('width',w).attr('height',h);
  const x = d3.scaleBand().domain(data.map(d=>d.name)).range([m.left, w-m.right]).padding(0.3);
  const y = d3.scaleLinear().domain([0, d3.max(data,d=>d.sales)*1.1]).range([h-m.bottom, m.top]);
  const grad = svg.append('defs').append('linearGradient').attr('id','sbGrad').attr('x1','0').attr('x2','0').attr('y1','0').attr('y2','1');
  grad.append('stop').attr('offset','0%').attr('stop-color','#1E2A4A');
  grad.append('stop').attr('offset','100%').attr('stop-color','#445C86');
  svg.append('g').selectAll('rect').data(data).join('rect')
    .attr('x', d=>x(d.name)).attr('width', x.bandwidth())
    .attr('y', h-m.bottom).attr('height', 0).attr('rx',8).attr('fill','url(#sbGrad)')
    .transition().duration(700).attr('y', d=>y(d.sales)).attr('height', d=> h-m.bottom - y(d.sales));
  svg.append('g').attr('transform',`translate(0,${h-m.bottom})`).call(d3.axisBottom(x))
    .selectAll('text').style('font-size','11px').style('fill','#445C86').attr('transform','rotate(-20)').style('text-anchor','end');
  svg.append('g').attr('transform',`translate(${m.left},0)`).call(d3.axisLeft(y).ticks(5))
    .selectAll('text').style('font-size','11px').style('fill','#445C86');
  svg.selectAll('.domain, .tick line').attr('stroke','#FCEFDE');
}

      <div class="bg-white rounded-3xl shadow-soft p-6">
        <h3 class="font-extrabold text-navy-500 mb-4">Display</h3>
        <div class="space-y-3">
          ${selectField('Currency','preferences.currency', s.preferences.currency, [['ZAR','South African Rand'],['USD','US Dollar'],['EUR','Euro'],['GBP','British Pound']])}
          ${selectField('Default catalog view','preferences.defaultView', s.preferences.defaultView, [['grid','Grid'],['list','List']])}
          ${selectField('Density','preferences.density', s.preferences.density, [['comfortable','Comfortable'],['compact','Compact']])}
        </div>
      </div>
      <div class="bg-white rounded-3xl shadow-soft p-6">
        <h3 class="font-extrabold text-navy-500 mb-4">Notifications</h3>
        ${toggleField('Email notifications','preferences.notifications', s.preferences.notifications)}
        ${toggleField('Auto-save showcases','preferences.autoSaveShowcases', s.preferences.autoSaveShowcases)}
      </div>
      <div class="bg-white rounded-3xl shadow-soft p-6">
        <h3 class="font-extrabold text-navy-500 mb-4">Data</h3>
        <p class="text-sm text-navy-300 mb-4">Your showcases and preferences are stored locally in this browser.</p>
        <div class="flex gap-2 flex-wrap">
          <button id="resetStore" class="btn btn-ghost"><i data-lucide="rotate-ccw" style="width:16px;height:16px"></i> Reset to defaults</button>
          <button id="exportData" class="btn btn-ghost"><i data-lucide="download" style="width:16px;height:16px"></i> Export data</button>
        </div>
      </div>
    </div>
    <div class="mt-6 flex justify-end">
      <button id="saveSettings" class="btn btn-primary"><i data-lucide="save" style="width:16px;height:16px"></i> Save changes</button>
    </div>`;

  document.getElementById('saveSettings').addEventListener('click', ()=>{
    view.querySelectorAll('[data-key]').forEach(el=>{
      const key = el.dataset.key;
      const value = el.type === 'checkbox' ? el.checked : el.value;
      const [a,b] = key.split('.');
      store.settings[a][b] = value;
    });
    saveStore(); toast('Settings saved','save');
  });
  document.getElementById('resetStore').addEventListener('click', ()=>{
    if(confirm('Reset all data and preferences to defaults?')){
      localStorage.removeItem(STORAGE_KEY);
      Object.assign(store, loadStore());
      renderSettings(view); toast('Reset to defaults','rotate-ccw');
    }
  });
  document.getElementById('exportData').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(store, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sku-showroom-data.json';
    a.click();
    toast('Data exported','download');
  });
}

function textField(label, key, value){
  return `<label class="block"><div class="text-xs font-bold uppercase tracking-wider text-navy-400">${label}</div>
    <input data-key="${key}" class="input-plain mt-1" value="${value}"></label>`;
}
function selectField(label, key, value, options){
  return `<label class="block"><div class="text-xs font-bold uppercase tracking-wider text-navy-400">${label}</div>
    <select data-key="${key}" class="input-plain mt-1">
      ${options.map(([v,n])=>`<option value="${v}" ${v===value?'selected':''}>${n}</option>`).join('')}
    </select></label>`;
}
function toggleField(label, key, value){
  return `<label class="flex items-center justify-between py-3">
    <span class="font-semibold text-navy-500 text-sm">${label}</span>
    <input data-key="${key}" type="checkbox" ${value?'checked':''} class="w-12 h-7 appearance-none rounded-full bg-cream-300 checked:bg-coral-500 transition relative cursor-pointer before:content-[''] before:absolute before:top-0.5 before:left-0.5 before:w-6 before:h-6 before:rounded-full before:bg-white before:transition checked:before:translate-x-5">
  </label>`;
}

// ============================================================================
// MOBILE NAV + BOOT
// ============================================================================
function openSidebarMobile(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('backdrop').classList.remove('hidden'); }
function closeSidebarMobile(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').classList.add('hidden'); }
document.getElementById('menuBtn').addEventListener('click', openSidebarMobile);
document.getElementById('backdrop').addEventListener('click', closeSidebarMobile);

if(!location.hash) location.hash = '#/dashboard';
navigate();
lucide.createIcons();
</script>
